schema_version = 3

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false

[memory]
backend = "memorycore"
auto_save = true
hygiene_enabled = true
archive_after_days = 7
purge_after_days = 30
embedding_provider = "none"

[agents.default]
model_provider = "openai.default"
risk_profile = "default"
runtime_profile = "default"

[providers.models.openai.default]
# Point this at the Responses-compatible translator running on the host.
wire_api = "responses"
base_url = "http://host.docker.internal:8080/v1"
model = "llama3.2"
temperature = 0.7

[risk_profiles.default]
auto_approve = ["file_read", "file_write", "file_edit", "memory_recall", "memory_store", "web_search_tool", "web_fetch", "calculator", "glob_search", "content_search", "image_info", "git_operations"]
level = "supervised"

[runtime_profiles.default]
max_context_tokens = 32000
max_tool_iterations = 50
max_tool_result_chars = 50000

[runtime_profiles.default.context_compression]
enabled = false
tool_result_retrim_chars = 2000
