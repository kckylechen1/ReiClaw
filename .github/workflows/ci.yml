name: Quality Gate

on:
  pull_request:
    # A stacked PR's base points at its parent cursor/* branch, not master.
    # Filtering on [master] meant those PRs never triggered the gate at all —
    # 24 of 30 open refactor PRs had only the two base-filter-free workflows
    # (path labeler, PR title) ever report. Match every base so the gate is
    # what decides, not the branch topology.
    branches: ['**']
  push:
    branches: [master]
  # Merge queue: GitHub builds a temporary `gh-readonly-queue/master/…` branch
  # and fires `merge_group`. The required `CI Required Gate` must report on that
  # branch or queued PRs stall, so the full gate runs here too.
  merge_group:

concurrency:
  # Preserve every push's selected work: a later prose push must not cancel
  # an earlier code push or replace it while pending. PRs still key on their
  # number; merge groups keep their independent queue refs.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Keep the workflow unconditional: path-filtered required workflows remain
  # pending. Only the documented prose allowlist skips the runtime matrix.
  #
  # The account's hosted runners are capped at 20 concurrent jobs, so a run
  # with more jobs than that queues against itself. Cheap checks therefore
  # share jobs: this one also selects the targeted jobs and checks Rust
  # formatting before the runtime matrix, and `policy` groups the light
  # policy, Nix and web checks.
  changes:
    name: Change Scope and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs_build: ${{ steps.scope.outputs.docs_build }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      test_matrix: ${{ steps.test-matrix.outputs.matrix }}
      installer: ${{ steps.targeted.outputs.installer }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Test CI helpers and required-result policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_ci_*.py' -v
      - name: Validate workflow semantics
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          bash scripts/ci/download_tool.sh \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            "$download_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $download_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$download_dir/actionlint.tar.gz" -C "$download_dir" actionlint
          "$download_dir/actionlint" -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/ci-code-analysis.yml
      - name: Classify the event's actual diff
        id: scope
        run: python3 scripts/ci/change_scope.py
      # One Test job per partition phase (each leg's main run and each extra
      # run), derived from dev/ci/test-partition.json so a new leg or extra
      # run cannot be left out of the matrix. A malformed partition fails
      # here, and the required gate rejects a failed classification.
      - name: Derive the test matrix
        id: test-matrix
        shell: bash
        run: |
          matrix="$(bash scripts/dev/leg.sh --matrix)"
          jq -e 'type == "array" and length > 0' <<<"$matrix" >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  Test (\(.name))"' <<<"$matrix"
      # A targeted job a PR's diff cannot affect stays skipped. Pushes and
      # merge groups always run it, which keeps its Rust cache warm.
      - name: Select the targeted installer-drift job
        id: targeted
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
          pick() {
            if grep -Eq "$1" <<<"$changed"; then
              echo "$2=true" >> "$GITHUB_OUTPUT"
            else
              echo "$2=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # The installer generator derives every install surface from Cargo
          # manifests (features), xtask, and the surfaces themselves.
          pick '(^|/)Cargo\.toml$|^Cargo\.lock$|^xtask/|^dev/ci/|^dist/|^scripts/ci/install|^install\.sh$|^flake\.nix$|^\.cargo/config\.toml$|^\.github/workflows/ci\.yml$' installer
      # Fail Rust formatting before the runtime matrix starts.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        if: steps.scope.outputs.full == 'true'
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Toolchain pin guard (self-test + active check)
        if: steps.scope.outputs.full == 'true'
        run: |
          bash scripts/ci/toolchain_gate.test.sh
          bash scripts/dev/cargo-local.test.sh
          bash scripts/dev/leg.test.sh
          bash scripts/ci/toolchain_gate.sh
      - name: Rust quality gate orchestration self-test
        if: steps.scope.outputs.full == 'true'
        run: bash scripts/ci/rust_quality_gate.test.sh
      - name: Check formatting
        if: steps.scope.outputs.full == 'true'
        run: cargo fmt --all -- --check
      # Orphaned sources, module-wide dead-code silencing, and the approved
      # crate list with workspace-lint opt-in. Pure Python, so it reports
      # within the first minute; it runs even when formatting failed.
      - name: Source tree gate
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' }}
        run: python3 scripts/ci/source_tree_gate.py

  # ── Required quality gate ─────────────────────────────────────────────────

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # 25: a cold rust-cache after a Cargo.lock change puts a full workspace
    # clippy at 14-15m on hosted runners.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh ripgrep
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo_log="${RUNNER_TEMP}/cargo-clippy.log"
          SECONDS=0
          cargo clippy \
            --workspace \
            --all-targets \
            --locked \
            --features ci-all \
            -- -D warnings 2>&1 | tee "$cargo_log"
          cargo_status=${PIPESTATUS[0]}
          duration_seconds=$SECONDS
          set -e

          workspace_path_compiles="$(grep -E -c 'Compiling.*\([^)]*(reiclaw|zeroclaw)' "$cargo_log" || true)"
          total_compiles="$(grep -c 'Compiling' "$cargo_log" || true)"
          downloaded_crates="$(grep -c 'Downloaded' "$cargo_log" || true)"
          cache_hit="${RUST_CACHE_HIT:-unknown}"
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"

          {
            echo "### Lint diagnostics"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner OS | \`${{ runner.os }}\` |"
            echo "| Rust cache exact hit | \`${cache_hit}\` |"
            echo "| Clippy duration | \`${duration_seconds}s\` |"
            echo "| Clippy status | \`${cargo_status}\` |"
            echo "| Workspace path compile lines | \`${workspace_path_compiles}\` |"
            echo "| Total compile lines | \`${total_compiles}\` |"
            echo "| Downloaded crate lines | \`${downloaded_crates}\` |"
          } >> "$summary_file"

          exit "$cargo_status"
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      # The architecture guards (config-write isolation, Fluent coverage) are
      # ordinary tests in the root `architecture` test target, so the
      # `Test (app)` leg already runs them under nextest. Running them here
      # too cost a second debug build of the root package on the critical path.
      - name: Provider dispatch gate (no direct ModelProvider method calls outside ProviderDispatch)
        run: bash scripts/ci/provider_dispatch_gate.sh
      # Fluent catalog syntax gate. Locales drift silently otherwise — the
      # runtime embeds en and falls back to it, so a broken translated
      # catalog only shows at runtime. It builds xtask in the dev profile,
      # which no test phase reuses, so it lives here instead of serially
      # extending a test leg on the critical path.
      - name: Fluent catalog syntax gate
        run: cargo fluent check



  # ── Build + check fan-out ─────────────────────────────────────────────────

  build:
    name: ${{ matrix.label }} ${{ matrix.target }}
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cmd: build
            label: Build
          - os: macos-26-intel
            target: aarch64-apple-darwin
            cmd: check
            label: Check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - name: Test local build storage on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! brew list --versions bash >/dev/null 2>&1; then
            brew install bash
          fi
          host_bash_dir="$(brew --prefix bash)/bin"
          export PATH="$host_bash_dir:$PATH"
          bash scripts/dev/cargo-local.test.sh
          bash scripts/dev/leg.test.sh
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: bash scripts/ci/apt_install.sh mold
      - name: Ensure web/dist placeholder exists
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: ${{ matrix.label }}
        shell: bash
        run: |
          set +e
          cargo_log="${RUNNER_TEMP}/cargo-build-${{ matrix.target }}.log"
          SECONDS=0
          cargo ${{ matrix.cmd }} --profile ci --locked --target ${{ matrix.target }} 2>&1 | tee "$cargo_log"
          cargo_status=${PIPESTATUS[0]}
          duration_seconds=$SECONDS
          set -e

          workspace_path_compiles="$(grep -E -c 'Compiling.*\([^)]*(reiclaw|zeroclaw)' "$cargo_log" || true)"
          total_compiles="$(grep -c 'Compiling' "$cargo_log" || true)"
          downloaded_crates="$(grep -c 'Downloaded' "$cargo_log" || true)"
          cache_hit="${RUST_CACHE_HIT:-unknown}"
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"

          {
            echo "### ${{ matrix.label }} diagnostics: ${{ matrix.target }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | \`${{ matrix.target }}\` |"
            echo "| Runner OS | \`${{ runner.os }}\` |"
            echo "| Rust cache exact hit | \`${cache_hit}\` |"
            echo "| Cargo duration | \`${duration_seconds}s\` |"
            echo "| Cargo status | \`${cargo_status}\` |"
            echo "| Workspace path compile lines | \`${workspace_path_compiles}\` |"
            echo "| Total compile lines | \`${total_compiles}\` |"
            echo "| Downloaded crate lines | \`${downloaded_crates}\` |"
          } >> "$summary_file"

          exit "$cargo_status"
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  # `lint` checks the ci-all graph. Keep these distinct no-default-feature
  # graphs (and the 32-bit target) in the required gate. Each job checks two
  # graphs back to back to stay under the hosted concurrency cap; the second
  # check still runs and reports when the first fails.
  check:
    name: Check (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no default features, 32-bit
            targets: i686-unknown-linux-gnu
            sys_deps: gcc-multilib
            first: --no-default-features
            second: --target i686-unknown-linux-gnu --no-default-features
          # The second graph is an explicit standard feature selection
          # without Cargo defaults.
          - name: slim control, minimal companion
            targets: ""
            sys_deps: ""
            first: --all-targets --no-default-features --features slim-control
            second: --no-default-features --features agent-runtime,default-channels,gateway,observability-prometheus,schema-export
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        id: rust-cache
        with:
          key: pair-${{ strategy.job-index }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install system dependencies
        if: matrix.sys_deps != ''
        run: bash scripts/ci/apt_install.sh ${{ matrix.sys_deps }}
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: cargo check ${{ matrix.first }}
        run: cargo check --locked ${{ matrix.first }}
      - name: cargo check ${{ matrix.second }}
        if: ${{ !cancelled() }}
        run: cargo check --locked ${{ matrix.second }}

  # ── Tests ─────────────────────────────────────────────────────────────────

  # The workspace is tested as matrix legs so no single job carries the whole
  # compile, and each extra feature run is its own job instead of a second,
  # serial compile after its leg. The single source of truth for which
  # package belongs to which leg, and for every leg phase, is
  # dev/ci/test-partition.json (see `scripts/dev/leg.sh --matrix`); the guard
  # step fails the job the moment a workspace member is missing from (or
  # duplicated in) that file. The required gate reads this job's aggregate
  # result, so every matrix entry must succeed.
  test:
    name: Test (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # 45 per phase. A cold leg once measured ~35 minutes; a timed-out job
    # also skips the rust-cache save step, so the cap must clear a cold leg
    # with room.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        id: rust-cache
        with:
          cache-on-failure: true
          # Per-leg cache so each leg only carries its own build graph. Extra
          # runs share their leg's dependency graph, so they restore the
          # leg's cache and only the main phase writes it.
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.phase == 'main' }}
          shared-key: test-${{ matrix.leg }}
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Install mold linker
        run: bash scripts/ci/apt_install.sh mold
      - name: Install cargo-nextest
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          bash scripts/ci/download_tool.sh https://get.nexte.st/latest/linux "$download_dir/nextest.tar.gz"
          tar zxf "$download_dir/nextest.tar.gz" -C ~/.cargo/bin
      - name: Partition guard (every workspace member in exactly one leg)
        shell: bash
        run: |
          members="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name' | sort)"
          listed="$(jq -r '[.legs[][], .excluded[]] | .[]' dev/ci/test-partition.json | sort)"
          dupes="$(printf '%s\n' "$listed" | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Listed more than once in dev/ci/test-partition.json: $dupes"
            exit 1
          fi
          if [ "$members" != "$listed" ]; then
            echo "::error::dev/ci/test-partition.json does not match the workspace members"
            diff <(printf '%s\n' "$members") <(printf '%s\n' "$listed") || true
            exit 1
          fi
      - name: Run tests
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
          PHASE: ${{ matrix.phase }}
          LEG_RUNNER: nextest
          # Keep hosted CI's existing profile when using the local entrypoint.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        # Packages, per-leg features and extra filtered runs all come from
        # dev/ci/test-partition.json through the same runner used locally.
        # Landlock is an extra run on the runtime leg rather than a leg
        # feature: with `sandbox-landlock` on,
        # Auto sandbox detection prefers Landlock, which would silently change
        # every other runtime test. --no-fail-fast: one failing test must not
        # cancel the rest of the phase — a single flake otherwise hides real
        # failures in the same run (observed on master: one bridge e2e flake
        # cancelled ~8.6k queued tests).
        run: |
          bash scripts/dev/leg.sh --no-fail-fast --phase "$PHASE" "$LEG"

  # ── Policy, Nix and web checks ────────────────────────────────────────────
  # Light checks share one job (see the concurrency note on `changes`). Every
  # step runs even after an earlier one fails, so each check still reports.
  # Repository structure and Nix steps are PR-only: nothing there writes a
  # cache, and the PR run already proved them.

  policy:
    name: Policy, Nix and Web
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Guard declared submodules
        if: ${{ !cancelled() && github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail

          gitlinks="$(mktemp)"
          declared="$(mktemp)"
          allowed="$(mktemp)"

          git ls-files -s | awk '$1 == "160000" { print $4 }' | sort > "$gitlinks"
          { git config --file .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true; } \
            | awk '{ print $2 }' | sort > "$declared"
          printf '%s\n' 'docs/book/po' > "$allowed"

          if ! cmp -s "$gitlinks" "$declared"; then
            echo "::error::Gitlink paths must exactly match .gitmodules paths."
            echo "Index gitlinks:"
            sed 's/^/  /' "$gitlinks"
            echo ".gitmodules paths:"
            sed 's/^/  /' "$declared"
            exit 1
          fi

          if ! cmp -s "$gitlinks" "$allowed"; then
            echo "::error::Unexpected submodule path. Update this guard when adding an intentional submodule."
            echo "Allowed submodule paths:"
            sed 's/^/  /' "$allowed"
            echo "Actual gitlink paths:"
            sed 's/^/  /' "$gitlinks"
            exit 1
          fi
      - name: Test translation release submodule handling
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: scripts/release/refresh-translations.test.sh
      - name: Validate nix/hashes.json matches Cargo.lock git deps
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then
            echo "Cargo.lock not found; nothing to check."
            exit 0
          fi
          # Extract git-dep keys from Cargo.lock using the same Python
          # logic as refresh-nix-hashes.sh.
          python3 scripts/ci/list_git_dep_keys.py > /tmp/lock_keys.json
          LOCK_COUNT=$(jq length /tmp/lock_keys.json)
          echo "Found $LOCK_COUNT git-sourced package(s) in Cargo.lock."
          if [[ "$LOCK_COUNT" -eq 0 ]]; then
            echo "No git deps; nothing to check."
            exit 0
          fi
          if [[ ! -f nix/hashes.json ]]; then
            echo "error: nix/hashes.json not found — git deps present but no hashes file."
            exit 1
          fi
          HASH_KEYS=$(jq 'keys' nix/hashes.json)
          MISSING=$(jq -n --argjson lock "$(cat /tmp/lock_keys.json)" \
            --argjson hash "$HASH_KEYS" \
            '$lock - $hash')
          MISSING_COUNT=$(echo "$MISSING" | jq length)
          if [[ "$MISSING_COUNT" -gt 0 ]]; then
            echo "error: $MISSING_COUNT git-dep hash(es) missing from nix/hashes.json:"
            echo "$MISSING" | jq -r '.[]'
            echo ""
            echo "Run scripts/dev/refresh-nix-hashes.sh and commit the result."
            exit 1
          fi
          echo "All git deps have hashes in nix/hashes.json."
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm ci
      - name: Run permission and catalog regressions
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run test:permissions
      - name: Run owner review regressions
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run test:review
      - name: Run chat surface regressions
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run test:chat
      - name: Run monitor component regressions
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run test:monitor
      - name: Typecheck and build web client
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run build
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        if: ${{ !cancelled() }}
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: ${{ !cancelled() }}
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          bash scripts/ci/download_tool.sh \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz \
            "$download_dir/cargo-deny.tar.gz"
          tar zxf "$download_dir/cargo-deny.tar.gz" -C ~/.cargo/bin --strip-components=1
      - name: Check default dependency policy
        if: ${{ !cancelled() }}
        run: cargo deny --locked check
      - name: Check dependency policy for all workspace features
        if: ${{ !cancelled() }}
        run: cargo deny --workspace --all-features --locked check
      - name: Verify dependency policy boundaries
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/dependency_policy_smoke.py
      - name: Lockfile integrity
        if: ${{ !cancelled() }}
        run: cargo verify-project && cargo fetch --locked

      - name: Validate YAML workflow syntax
        if: ${{ !cancelled() }}
        run: |
          pip install pyyaml -q 2>/dev/null || true
          python3 - <<'PY'
          import yaml

          for path in (".github/workflows/ci.yml",):
              yaml.safe_load(open(path))
              print(f"{path}: valid")
          PY
      - name: Install cargo-audit
        if: ${{ !cancelled() }}
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          bash scripts/ci/download_tool.sh \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            "$download_dir/cargo-audit.tgz"
          tar zxf "$download_dir/cargo-audit.tgz" -C ~/.cargo/bin --strip-components=1
      - name: Run cargo audit (RustSec advisory database)
        if: ${{ !cancelled() }}
        run: cargo audit
      - name: Install Nix
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: bash scripts/ci/apt_install.sh nix-bin nix-setup-systemd
      - name: Verify Nix
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: sudo nix --version
      - name: Evaluate Nix module assertions
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: sudo nix --extra-experimental-features "nix-command flakes" build .#checks.x86_64-linux.nixos-module-eval --no-link
      - name: Evaluate package feature overrides
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          sudo nix --extra-experimental-features "nix-command flakes" \
            eval --json .#packages.x86_64-linux.reiclaw \
            --apply "$(cat nix/package-eval.nix)"

  docs-style:
    name: Docs Style
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install pinned Markdown parser
        run: python3 -m pip install -r scripts/ci/docs-requirements.txt
      - name: Test document validation
        run: python3 -m unittest discover -s scripts/ci -p 'test_docs_*.py' -v
      - name: Docs quality gate (markdown lint + em-dash prose check)
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: bash scripts/ci/docs_quality_gate.sh
      - name: Docs source, navigation and local-link gate
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: bash scripts/ci/docs_links_gate.sh

  # Navigation, renderer, generator and build changes must prove the real
  # publication build. Ordinary prose uses the source/link gate above.
  docs-build:
    name: Docs Build
    needs: [changes, docs-style]
    if: needs.changes.outputs.docs_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Install mdBook
        env:
          MDBOOK_BIN_VERSION: v0.5.0
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          bash scripts/ci/download_tool.sh \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_BIN_VERSION}/mdbook-${MDBOOK_BIN_VERSION}-aarch64-unknown-linux-musl.tar.gz" \
            "$download_dir/mdbook.tar.gz"
          sudo tar -xzf "$download_dir/mdbook.tar.gz" -C /usr/local/bin
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: docs-deploy
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install gettext
        run: bash scripts/ci/apt_install.sh gettext
      - name: Validate translation formats
        run: |
          failed=0
          for po in docs/book/po/*.po; do
            [ -f "$po" ] || continue
            msgfmt --check-format "$po" -o /dev/null || failed=1
          done
          exit "$failed"
      - name: Build references, rustdoc and all locales without publishing
        run: cargo mdbook build

  installer-drift:
    name: Installer Drift
    needs: [changes]
    # Selected by `changes`: a PR touching no install input cannot drift.
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test POSIX source installer
        run: bash scripts/ci/install_source_smoke.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check generated install surfaces are in sync with the spec
        run: cargo generate installers --check

  # ── Required gate ─────────────────────────────────────────────────────────
  # Required-check policy: require this stable aggregate. Administrators must
  # verify the live protection list separately; comments do not set GitHub rules.

  gate:
    name: CI Required Gate
    if: always()
    needs: [changes, lint, build, check, test, policy, docs-style, docs-build, installer-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required_gate.py
