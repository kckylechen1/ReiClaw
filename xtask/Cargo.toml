[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "web"
path = "src/bin/web.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
cargo_metadata = "0.18"

[dev-dependencies]
reiclaw-config = { workspace = true }
tempfile = "3"
toml = "1.0"

[lints]
workspace = true
