[package]
name = "reiclaw-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory backends, embeddings, consolidation, and retrieval for ZeroClaw."
publish = false

[dependencies]
reiclaw-http.workspace = true
reiclaw-log.workspace = true
reiclaw-api.workspace = true
reiclaw-provider-dispatch.workspace = true
reiclaw-config = { workspace = true, default-features = false }
anyhow = "1.0"
async-trait = "0.1"
jiff.workspace = true
parking_lot = "0.12"
reiclaw-infra.workspace = true
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring"] }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
# Typed records / v44 schema adoption on SQLite 3.54.1 / portable-kernel 1.9.0 baseline.
portable_kernel = { package = "portable-kernel", version = "1.9.0", git = "https://github.com/kckylechen1/Tachi.git", rev = "b1428b4d65e3cb21bb8af0d6e5dee4640ab95dea", default-features = false, optional = true }

[features]
voice-surface = ["reiclaw-api/voice-surface"]
memorycore = ["dep:portable_kernel", "rusqlite/functions"]

[dev-dependencies]
filetime = "0.2"
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
toml = "1.0"

[lints]
workspace = true
