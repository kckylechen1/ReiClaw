[package]
name = "zeroclaw-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory backends, embeddings, consolidation, and retrieval for ZeroClaw."
publish = false

[dependencies]
zeroclaw-http.workspace = true
zeroclaw-log.workspace = true
zeroclaw-api.workspace = true
zeroclaw-provider-dispatch.workspace = true
zeroclaw-spawn.workspace = true
zeroclaw-config = { workspace = true, default-features = false }
anyhow = "1.0"
async-trait = "0.1"
jiff.workspace = true
parking_lot = "0.12"
zeroclaw-infra.workspace = true
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring"] }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
# Jiff time migration on the existing SQLite 3.54.1 / portable-kernel 1.9.0 baseline.
portable_kernel = { package = "portable-kernel", version = "1.9.0", git = "https://github.com/kckylechen1/Tachi.git", rev = "fe6ab1d215a31b72777dc7c9c314846bd37a7dcf", default-features = false, optional = true }

[features]
voice-surface = ["zeroclaw-api/voice-surface"]
tachi = ["dep:portable_kernel", "rusqlite/functions"]

[dev-dependencies]
filetime = "0.2"
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
toml = "1.0"
