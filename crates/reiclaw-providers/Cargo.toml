[package]
name = "reiclaw-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI Responses inference, model routing, and multimodal processing."
publish = false

[dependencies]
reiclaw-http.workspace = true
reiclaw-log.workspace = true
reiclaw-api.workspace = true
reiclaw-provider-dispatch.workspace = true
reiclaw-config = { workspace = true, default-features = false }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "rustls-tls-native-roots-no-provider", "__rustls-ring", "stream", "socks"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
parking_lot = "0.12"
tokio = { version = "1.50", features = ["test-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3.26"

[lints]
workspace = true
