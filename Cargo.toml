[workspace]
# The root package is an implicit member; an explicit "." defeats path exclusions.
members = ["crates/reiclaw-api", "crates/reiclaw-infra", "crates/reiclaw-config", "crates/reiclaw-http", "crates/reiclaw-policy", "crates/reiclaw-log", "crates/reiclaw-providers", "crates/reiclaw-provider-dispatch", "crates/reiclaw-memory", "crates/reiclaw-tools", "crates/reiclaw-runtime", "crates/reiclaw-eval", "crates/reiclaw-gateway", "crates/reiclaw-gateway-client", "bridges/acp", "bridges/telegram", "crates/reiclaw-tool-call-parser", "crates/reiclaw-macros", "xtask"]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kckylechen1/ReiClaw"
rust-version = "1.96.1"

[workspace.dependencies]
jiff = { version = "0.2.46", features = ["serde", "tzdb-bundle-always"] }
reiclaw-http = { path = "crates/reiclaw-http", version = "0.8.3" }
reiclaw-api = { path = "crates/reiclaw-api", version = "0.8.3" }
reiclaw-infra = { path = "crates/reiclaw-infra", version = "0.8.3" }
reiclaw-config = { path = "crates/reiclaw-config", version = "0.8.3", default-features = false }
reiclaw-log = { path = "crates/reiclaw-log", version = "0.8.3" }
reiclaw-providers = { path = "crates/reiclaw-providers", version = "0.8.3" }
reiclaw-provider-dispatch = { path = "crates/reiclaw-provider-dispatch", version = "0.8.3" }
reiclaw-memory = { path = "crates/reiclaw-memory", version = "0.8.3" }
reiclaw-tools = { path = "crates/reiclaw-tools", version = "0.8.3", default-features = false }
reiclaw-runtime = { path = "crates/reiclaw-runtime", version = "0.8.3", default-features = false }
reiclaw-eval = { path = "crates/reiclaw-eval", version = "0.8.3" }
reiclaw-gateway = { path = "crates/reiclaw-gateway", version = "0.8.3", default-features = false }
reiclaw-gateway-client = { path = "crates/reiclaw-gateway-client", version = "0.8.3" }
reiclaw-tool-call-parser = { path = "crates/reiclaw-tool-call-parser", version = "0.8.3" }
reiclaw-macros = { path = "crates/reiclaw-macros", version = "0.8.3" }
directories = "6.0"
reiclaw-policy = { path = "crates/reiclaw-policy", version = "0.8.3" }

# Lint levels every workspace package inherits through `[lints] workspace = true`
# (scripts/ci/source_tree_gate.py fails a package that does not opt in). When
# review catches the same class of mistake twice, the fix PR adds a rule here,
# in clippy.toml or deny.toml, or in the source tree gate (AGENTS.md rule 10).
# CI runs clippy with `-D warnings`, so "warn" fails CI without blocking local
# iteration.
[workspace.lints.clippy]
# The kernel is embedded by other processes (desktop and mobile workbenches,
# the gateway), so library code returns errors instead of ending the host
# process. CLI entry points that own the exit status opt out explicitly.
exit = "warn"
# No placeholder bodies on any path.
todo = "warn"
unimplemented = "warn"

[patch.crates-io]
# Upstream PR #558's unmerged candidate: rand update plus released protocol fixes.
# Replace this exact pin with a coordinated Axum/WebSocket release (#432/#647).
tungstenite = { version = "=0.29.0", git = "https://github.com/snapview/tungstenite-rs", rev = "b40760374c31d43253989c4b30132eeeb5f74e71" }

[package]
name = "reiclaw"
# Workspace crates are publish = false during microkernel transition.
publish = false
default-run = "rei"
version.workspace = true
edition.workspace = true
authors = ["theonlyhennygod"]
license.workspace = true
description = "Zero overhead. Zero compromise. 100% Rust. The fastest, smallest AI assistant."
repository.workspace = true
readme = "README.md"
keywords = ["ai", "agent", "cli", "assistant", "chatbot"]
categories = ["command-line-utilities", "api-bindings"]
rust-version.workspace = true
include = [
  "/src/**/*",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
  "/web/dist/**/*",
]

[[bin]]
name = "rei"
path = "src/main.rs"

[lib]
name = "reiclaw"
path = "src/lib.rs"

[dependencies]
reiclaw-policy.workspace = true
reiclaw-http.workspace = true
# Internal workspace crates — versions and paths declared once in [workspace.dependencies]
reiclaw-api.workspace = true
reiclaw-infra.workspace = true
reiclaw-config = { workspace = true, features = ["clap"] }
reiclaw-log.workspace = true
reiclaw-providers.workspace = true
reiclaw-memory.workspace = true
reiclaw-tools = { workspace = true, optional = true }
reiclaw-runtime = { workspace = true, optional = true }
reiclaw-gateway = { workspace = true, optional = true }
reiclaw-gateway-client = { workspace = true, optional = true }
reiclaw-macros.workspace = true
# CLI - minimal and fast
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap-markdown = "0.1"

# Async runtime - feature-optimized for size
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }

# HTTP client - minimal features
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"
toml = "1.0"

# JSON Schema generation for config export
schemars = "1.2"

# URL encoding for gateway pairing management
urlencoding = "2.1"

# Error handling
anyhow = "1.0"

# UUID generation
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Async traits
async-trait = "0.1"

jiff.workspace = true

# Interactive CLI prompts (memory CLI uses dialoguer unconditionally)
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"

# WebSocket client for the `self-test` gateway probe (src/commands/self_test.rs)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }

# Gateway integration-test fixtures (enabled with the gateway feature).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }

# Installer/surface metadata: which `[features]` are internal aggregates or
# meta toggles rather than user-selectable rows. This bit is NOT derivable from
# the feature graph (e.g. `embedded-web` is a meta toggle despite its
# single cross-crate reference), so
# it lives here in the canonical registry. install.sh and `cargo cmd convert`
# both read this; neither shadows it with its own list.
[package.metadata.reiclaw]
non_row_features = [
    "default",
    "default-channels",
    "channels-full",
    "slim-control",
    "ci-all",
    "landlock",
    "metrics",
    "embedded-web",
    "voice-surface",
]
# Compatibility exclusions for standard distribution artifacts. Release
# workflows pass only their target triple; feature policy stays here.
[package.metadata.reiclaw.dist_target_exclusions]
arm-unknown-linux-gnueabihf = ["observability-prometheus"]
armv7-unknown-linux-gnueabihf = ["observability-prometheus"]

[features]
default = [
    "agent-runtime",
    "default-channels",
    "gateway",
    "memory-core",
    "observability-prometheus",
    "schema-export",
]

# Optional lean control profile. Select with --no-default-features; Cargo
# features are additive, so using it with defaults retains the standard surface.
# ACP server and Webhook ingress, plus WeChat and WeCom channels.
slim-control = [
    "agent-runtime",
    "gateway",
    "channel-acp-server",
    "channel-webhook",
    ]

# The core agent runtime — agent loop, tools, persistence subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
# Channels are opt-in via the lean `default-channels` bundle, `channels-full`,
# or individual `channel-*` features.
agent-runtime = [
    "dep:reiclaw-runtime", "dep:reiclaw-tools",
    "dep:reiclaw-gateway-client",
    "dep:tokio-tungstenite",
    "dep:rustls",
]

# Lean channel bundle included in `default`. These channels cover local/editor
# ACP, gateway/webhook ingress, and common first-run external chat paths.
default-channels = [
    "channel-acp-server", "channel-webhook",
    "channel-telegram",
]

# Compatibility alias for the retained default channel surface.
channels-full = ["default-channels"]

# Major subsystems — each forwards to exactly ONE crate
gateway = [
    "dep:reiclaw-gateway",
    "dep:axum", "dep:tower",
]
schema-export = ["reiclaw-config/schema-export", "reiclaw-gateway?/schema-export"]

# Channel feature flags retained for CLI/installer preset compatibility.
channel-telegram = []
channel-webhook = []
channel-acp-server = []

# Node discovery surface (gateway `/ws/nodes` registry + LAN mDNS peer hints).
# Default-off, mirroring `reiclaw-gateway`'s own `nodes` feature. The root
# package needs this forward so targets that construct `gateway::AppState`
# (e.g. the `component` test) can cfg-gate the node-only fields.
nodes = ["reiclaw-gateway?/nodes"]
memory-core = ["reiclaw-memory/memorycore", "reiclaw-runtime?/memory-core", "reiclaw-gateway?/memory-core"]

# Backends and platform flags — each forwards to ONE crate
observability-prometheus = [
    "reiclaw-runtime/observability-prometheus",
    "reiclaw-gateway/observability-prometheus",
]
sandbox-landlock = ["reiclaw-runtime/sandbox-landlock"]
sandbox-bubblewrap = ["reiclaw-runtime/sandbox-bubblewrap"]
embedded-web = ["reiclaw-gateway/embedded-web"]

# Backward-compatible aliases
landlock = ["sandbox-landlock"]
metrics = ["observability-prometheus"]

voice-surface = ["gateway", "reiclaw-gateway/voice-surface"]

# CI meta-feature
ci-all = [
    "nodes",
    "voice-surface",
    "agent-runtime",
    "channels-full",
    "memory-core",
    "observability-prometheus",
    "sandbox-landlock", "sandbox-bubblewrap",
    "reiclaw-runtime/heavy-tests",
]

# Keep local debug artifacts small. Repository Cargo config disables incremental
# compilation by default; short edit loops can opt in with CARGO_INCREMENTAL=1.
[profile.dev]
opt-level = 1                 # own code: mild opt, still fast to compile
debug = "line-tables-only"    # keep panic backtraces (file:line), drop the bulk of
                              # debuginfo — the main disk hog on a 1200+ dep tree

# Third-party deps: optimized once and then reused from target/ (no sccache
# or mold is assumed; rust-lld, the toolchain default on x86_64 Linux, links),
# so dev runtime is fast; debug=false drops their debuginfo entirely (you never
# step into deps), which is the real cut to the runaway target size. Reclaim
# disk with scripts/dev/target_sweep.sh, which keeps these and drops only
# workspace crates.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = "z"      # Optimize for size
lto = "fat"          # Maximum cross-crate optimization for smaller binaries
codegen-units = 1    # Serialized codegen for low-memory devices (e.g., Raspberry Pi 3 with 1GB RAM)
                     # Higher values (e.g., 8) compile faster but require more RAM during compilation
strip = true          # Remove debug symbols
panic = "abort"      # Reduce binary size

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast

[profile.ci]
inherits = "release"
lto = "thin"         # Much faster than fat LTO; still catches release-mode issues
codegen-units = 16   # Full parallelism for CI runners

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
reiclaw-eval.workspace = true
# Used only by root integration-test fixtures and assertions.
parking_lot = "0.12"
regex = "1.10"
tempfile = "3.26"
criterion = { version = "0.8", features = ["async_tokio"] }
wiremock = "0.6"
scopeguard = "1.2"
rcgen = "0.13"
# Reads the audit database in alias_cli tests.
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }

[[test]]
name = "component"
path = "tests/test_component.rs"

[[test]]
name = "integration"
path = "tests/test_integration.rs"

[[test]]
name = "system"
path = "tests/test_system.rs"

# Architecture invariant gates. Fail-on-detect for patterns that
# violate the workspace's ABSOLUTE RULE (AGENTS.md §1) — duplicate
# state across the codebase. Run with `cargo test --test architecture`
# during development; the workspace `cargo test` already includes it.
[[test]]
name = "architecture"
path = "tests/test_architecture.rs"

[[bench]]
name = "agent_benchmarks"
harness = false

[[bin]]
name = "rei-node-host"
path = "src/bin/rei-node-host.rs"
required-features = ["gateway", "nodes", "agent-runtime"]

[[test]]
name = "node_v2_process"
required-features = ["gateway", "nodes", "agent-runtime"]

[lints]
workspace = true
