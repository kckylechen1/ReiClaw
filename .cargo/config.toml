# The xtask aliases build in the default dev profile, not --release. xtask
# links zeroclaw-runtime and friends, so a release build meant a fat-LTO,
# codegen-units=1, opt-level=z compile of most of the workspace every time a
# PR ran `cargo generate`. The dev profile reuses the
# third-party deps already in target/debug (a separate named profile would
# duplicate all of them on disk), and the tasks are I/O bound anyway.
[alias]
web = "run -p xtask --bin web --"
generate = "run -p xtask --bin generate --"
# The Quality Gate's clippy command; run once before pushing.
lint-ci = "clippy --workspace --all-targets --locked --features ci-all -- -D warnings"

[build]
# Bound local disk use across worktrees and feature combinations.
# Opt in for a short edit loop with CARGO_INCREMENTAL=1.
incremental = false
rustdocflags = ["--default-theme=ayu"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static"]

# ARM64 Linux (Raspberry Pi 4/5, AWS Graviton, etc.)
# Prerequisite: aarch64-linux-gnu-gcc must be installed.
#   Arch:   sudo pacman -S aarch64-linux-gnu-gcc
#   Debian: sudo apt install gcc-aarch64-linux-gnu
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-Wl,-z,stack-size=8388608"]

# Android targets (NDK toolchain)
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,stack-size=8388608"]
